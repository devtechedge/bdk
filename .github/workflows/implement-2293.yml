name: Temporary BDK #2293 implementation

on:
  push:
    branches:
      - fix/2293-electrum-outpoint-fetch-errors

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fix and regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/electrum/src/bdk_electrum_client.rs')
          text = path.read_text()
          old = '''        for op in outpoints {
            if let Ok(tx) = self.fetch_tx(op.txid) {
                if let Some(txout) = tx.output.get(op.vout as usize) {
                    ops_spks_txs.push((op, txout.script_pubkey.clone(), tx));
                }
            }
        }'''
          new = '''        for op in outpoints {
            match self.fetch_tx(op.txid) {
                Ok(tx) => {
                    if let Some(txout) = tx.output.get(op.vout as usize) {
                        ops_spks_txs.push((op, txout.script_pubkey.clone(), tx));
                    }
                }
                Err(electrum_client::Error::Protocol(_)) => continue,
                Err(e) => return Err(e),
            }
        }'''
          if old not in text:
              raise SystemExit('Expected BDK #2293 block not found')
          path.write_text(text.replace(old, new, 1))
          PY

          cat > crates/electrum/tests/test_outpoint_fetch_errors.rs <<'RS'
          use std::net::TcpListener;

          use bdk_chain::bitcoin::{hashes::Hash, OutPoint, Txid};
          use bdk_chain::spk_client::SyncRequest;
          use bdk_electrum::electrum_client::{Client, ConfigBuilder};
          use bdk_electrum::BdkElectrumClient;

          #[test]
          fn outpoint_sync_reports_connection_errors() {
              // A "server" that accepts the connection and immediately closes it.
              let listener = TcpListener::bind("127.0.0.1:0").unwrap();
              let url = format!("tcp://{}", listener.local_addr().unwrap());
              std::thread::spawn(move || listener.incoming().for_each(drop));

              let config = ConfigBuilder::new().retry(0).build();
              let client = BdkElectrumClient::new(Client::from_config(&url, config).unwrap());
              let outpoint = OutPoint::new(Txid::from_byte_array([1; 32]), 0);
              let request = SyncRequest::<()>::builder_at(0).outpoints([outpoint]);

              let response = client.sync(request, 1, false);
              assert!(response.is_err(), "sync dropped the outpoint and returned {response:?}");
          }
          RS

      - name: Verify format
        run: cargo fmt --all -- --check

      - name: Run regression test
        run: cargo test -p bdk_electrum --test test_outpoint_fetch_errors

      - name: Commit implementation to target branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'devtechedge'
          git config user.email 'devtechedge@users.noreply.github.com'
          git add crates/electrum/src/bdk_electrum_client.rs crates/electrum/tests/test_outpoint_fetch_errors.rs
          git commit -m 'fix(electrum): propagate outpoint transaction fetch errors'
          git push origin HEAD:fix/2293-electrum-outpoint-fetch-errors

      - name: Remove temporary workflow from master
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout master
          git rm .github/workflows/implement-2293.yml
          git commit -m 'chore: remove temporary implementation workflow'
          git push origin HEAD:master
